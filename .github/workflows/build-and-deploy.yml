name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web app
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::error::Missing GOOGLE_SERVICES_JSON secret"; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Put APK on the website
        run: |
          mkdir -p dist/download
          cp android/app/build/outputs/apk/release/app-release.apk dist/download/abhyasa.apk
          echo "{\"version\": ${{ github.run_number }}, \"built\": \"$(date -u +%FT%TZ)\"}" > dist/download/version.json

      - uses: actions/upload-artifact@v5
        with:
          name: abhyasa-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Deploy website, APK and database rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "::error::Missing FIREBASE_SERVICE_ACCOUNT secret"; exit 1; fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          node -e '
            let j; try { j = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); } catch (e) { console.log("::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON. Paste the whole file from Project settings > Service accounts > Generate new private key."); process.exit(1); }
            if (j.type !== "service_account") { console.log("::error::FIREBASE_SERVICE_ACCOUNT is not a service-account key (type=" + j.type + "). Use Project settings > Service accounts > Generate new private key, not google-services.json."); process.exit(1); }
            console.log("Service account:", j.client_email, "project:", j.project_id);
          ' "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only hosting,firestore:rules --project abhyasa-3fe1d --non-interactive
